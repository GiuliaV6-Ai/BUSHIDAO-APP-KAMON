<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>軽量版 家紋帳</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div>
      <p>Kamon Catalog Lite</p>
      <h1>家紋帳</h1>
    </div>
    <strong id="totalCount">0</strong>
  </header>
  <main>
    <aside>
      <label>検索<input id="searchInput" type="search" placeholder="菊、柏、巴、丸ニ"></label>
      <label>かな<select id="kanaSelect"><option value="">すべて</option></select></label>
      <label>分類検索<input id="categorySearchInput" type="search" placeholder="例: 梅、菱、蝶"></label>
      <label>分類<select id="categorySelect"><option value="">すべて</option></select></label>
    </aside>
    <section>
      <div class="bar"><span id="resultCount">読み込み中...</span><select id="sortSelect"><option value="name">名前順</option><option value="category">分類順</option></select></div>
      <div id="grid" class="grid"></div>
    </section>
  </main>
  <dialog id="dialog">
    <button id="closeDialog" aria-label="閉じる">×</button>
    <div class="modal-crest crest"></div>
    <h2 id="detailName"></h2>
    <p id="detailMeta"></p>
    <small id="detailSource"></small>
    <button id="downloadButton" class="download-button">PNGダウンロード</button>
  </dialog>
  <script src="kamon-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
